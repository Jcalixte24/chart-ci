name: Mise à jour automatique Spotify + Deploy Vercel

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer Chrome et ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Installer les dépendances Python
        run: pip install selenium webdriver-manager

      - name: Exécuter le scraping Spotify
        run: python api/spotify.py

      - name: Vérifier que les données sont dans le bon dossier
        run: |
          ls -la data/
          echo "spotify_data.json :"
          head -5 data/spotify_data.json
          echo "spotify_history.json :"
          head -5 data/spotify_history.json

      - name: Commit et Push des nouvelles données
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/spotify_data.json data/spotify_history.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Aucun changement détecté."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Mise à jour auto des données Spotify"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Déployer sur Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel --prod --token=$VERCEL_TOKEN --yes
